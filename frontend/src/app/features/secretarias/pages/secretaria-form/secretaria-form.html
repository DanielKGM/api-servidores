<app-page-header
  [title]="isEditing ? 'Editar secretaria' : 'Nova secretaria'"
  description="Informe os dados principais da secretaria."
/>

<p-card styleClass="form-surface">
  <app-loading-bar [loading]="loading$ | async" />

  <form [formGroup]="form" class="entity-form" (ngSubmit)="salvar()">
    <div class="form-grid">
      <label class="form-field">
        <span>Nome</span>
        <input pInputText formControlName="nome" maxlength="150" />
        <app-field-error [control]="form.controls.nome" [submitted]="submitted" />
      </label>

      <label class="form-field">
        <span>Sigla</span>
        <input pInputText formControlName="sigla" maxlength="20" />
        <app-field-error [control]="form.controls.sigla" [submitted]="submitted" />
      </label>
    </div>

    <div class="form-actions">
      <a pButton routerLink="/secretarias" severity="danger" outlined>
        <i class="pi pi-times"></i>
        <span>Cancelar</span>
      </a>

      <button pButton type="submit" [disabled]="saving">
        @if (saving) {
          <i class="pi pi-spin pi-spinner"></i>
        } @else {
          <i class="pi pi-check"></i>
        }
        <span>Salvar</span>
      </button>
    </div>
  </form>
</p-card>
