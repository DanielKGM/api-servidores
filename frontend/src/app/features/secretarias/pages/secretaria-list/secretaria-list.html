<app-page-header
  title="Secretarias"
  description="Cadastro e manutencao das secretarias municipais."
  actionLabel="Adicionar"
  [actionLink]="['/secretarias/novo']"
/>

<p-card>
  <app-loading-bar [loading]="loading$ | async" />

  <p-table
    [value]="(secretarias$ | async) ?? []"
    dataKey="id"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    [alwaysShowPaginator]="true"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    [rowHover]="true"
    [stripedRows]="true"
    [tableStyle]="{ 'min-width': '42rem' }"
  >
    <ng-template #header>
      <tr>
        <th>Nome</th>
        <th>Sigla</th>
        <th>Criado em</th>
        <th class="table-column-actions">Acoes</th>
      </tr>
    </ng-template>

    <ng-template #body let-secretaria>
      <tr>
        <td>{{ secretaria.nome }}</td>
        <td>
          <p-tag [value]="secretaria.sigla" severity="info" />
        </td>
        <td>{{ secretaria.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td class="table-column-actions">
          <app-table-actions (edit)="editar(secretaria)" (remove)="confirmarExclusao(secretaria)" />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="empty-state">Nenhuma secretaria cadastrada.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
