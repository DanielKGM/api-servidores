<p-toast position="top-right" />
<p-confirm-dialog />

<div class="layout-shell" [class.layout-shell--collapsed]="sidebarCollapsed">
  <aside class="layout-sidebar">
    <a class="layout-brand" routerLink="/secretarias" aria-label="Servidores Municipais">
      <i class="pi pi-building-columns layout-brand__icon"></i>
      @if (!sidebarCollapsed) {
        <strong>Servidores Municipais</strong>
      }
    </a>
    <p-menu [model]="menuItems" styleClass="layout-menu" />
  </aside>

  <div class="layout-content">
    <p-toolbar class="layout-topbar" styleClass="layout-topbar-surface">
      <ng-template #start>
        <div class="layout-toolbar-group">
          <button
            pButton
            type="button"
            text
            rounded
            iconOnly
            [attr.aria-label]="sidebarCollapsed ? 'Expandir menu' : 'Recolher menu'"
            (click)="sidebarCollapsed = !sidebarCollapsed"
          >
            <i [class]="sidebarCollapsed ? 'pi pi-angle-right' : 'pi pi-angle-left'"></i>
          </button>

          <p-breadcrumb
            [model]="breadcrumbItems"
            [home]="breadcrumbHome"
            [style]="{ border: '0', padding: '0', background: 'transparent' }"
          />
        </div>
      </ng-template>
    </p-toolbar>

    <main class="layout-main">
      <router-outlet />
    </main>
  </div>
</div>
